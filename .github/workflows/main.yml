</head>
<body>
<div class="card">
  <div class="icon">
    <svg viewBox="0 0 24 24">
      <rect x="5" y="2" width="14" height="20" rx="2.5"/>
      <circle cx="12" cy="18.5" r="1" fill="#3b82f6"/>
    </svg>
  </div>
  <h1>Galaxy S23</h1>
  <div class="sub">One UI 6.1 &middot; Android 14 &middot; 120 Hz</div>
  <form method="POST" action="/auth">
    <label>Access code</label>
    <input type="password" name="p"
           placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;"
           autocomplete="off">
    <button type="submit">Connect &rarr;</button>
  </form>
  __ERR__
  <div class="foot">Snapdragon 8 Gen 2 &middot; Adreno 740</div>
</div>
</body>
</html>"""

ERR_HTML = b'<div class="err">&#10006; Incorrect access code</div>'


def make_login(bad: bool = False) -> bytes:
    return LOGIN_HTML.replace(b"__ERR__", ERR_HTML if bad else b"")


def parse_session(cookie_header: str) -> str | None:
    if not cookie_header or "sid=" not in cookie_header:
        return None
    try:
        c = http.cookies.SimpleCookie(cookie_header)
        return c["sid"].value if "sid" in c else None
    except Exception:
        return None


async def pipe_data(
    src: asyncio.StreamReader,
    dst: asyncio.StreamWriter,
) -> None:
    try:
        while True:
            data = await src.read(65536)
            if not data:
                break
            dst.write(data)
            await dst.drain()
    except (ConnectionResetError, BrokenPipeError, asyncio.CancelledError):
        pass
    finally:
        try:
            dst.close()
        except Exception:
            pass


async def handle(
    reader: asyncio.StreamReader,
    writer: asyncio.StreamWriter,
) -> None:
    try:
        buf = b""
        while b"\r\n\r\n" not in buf:
            chunk = await asyncio.wait_for(reader.read(8192), timeout=20)
            if not chunk:
                return
            buf += chunk
            if len(buf) > 131072:
                return

        head_raw, _, tail = buf.partition(b"\r\n\r\n")
        lines = head_raw.split(b"\r\n")
        req_line = lines[0].decode("latin-1", errors="replace")
        words = req_line.split(" ", 2)
        if len(words) < 2:
            return

        method = words[0].upper()
        path   = words[1]

        # Build two parallel header structures:
        # hdrs   → lowercase-keyed dict  (for logic)
        # hdrs_orig → original bytes list (for forwarding)
        hdrs: dict[str, str] = {}
        hdrs_orig: list[bytes] = []
        for line in lines[1:]:
            if b":" in line:
                k, _, v = line.partition(b":")
                hdrs[k.strip().decode("latin-1").lower()] = \
                    v.strip().decode("latin-1")
                hdrs_orig.append(line)

        cookie  = hdrs.get("cookie", "")
        tok     = parse_session(cookie)
        authed  = tok in SESSIONS
        is_ws   = hdrs.get("upgrade", "").lower() == "websocket"
        clen    = int(hdrs.get("content-length", "0"))

        # ── POST /auth ────────────────────────────────────────────
        if method == "POST" and path == "/auth":
            body = tail
            while len(body) < clen:
                chunk = await asyncio.wait_for(
                    reader.read(clen - len(body)), timeout=10
                )
                if not chunk:
                    break
                body += chunk
            params = urllib.parse.parse_qs(
                body.decode("utf-8", errors="replace")
            )
            pw = params.get("p", [""])[0]
            if hashlib.sha256(pw.encode()).hexdigest() == PASS_HASH:
                new_tok = os.urandom(24).hex()
                SESSIONS.add(new_tok)
                resp = (
                    "HTTP/1.1 302 Found\r\n"
                    "Location: /vnc.html?autoconnect=true&reconnect=true\r\n"
                    "Set-Cookie: sid=" + new_tok +
                    "; Path=/; HttpOnly; SameSite=Strict\r\n"
                    "Content-Length: 0\r\n\r\n"
                ).encode()
            else:
                body_resp = make_login(bad=True)
                resp = (
                    "HTTP/1.1 200 OK\r\n"
                    "Content-Type: text/html; charset=utf-8\r\n"
                    f"Content-Length: {len(body_resp)}\r\n\r\n"
                ).encode() + body_resp
            writer.write(resp)
            await writer.drain()
            return

        # ── Unauthenticated non-WS → login page ──────────────────
        if not authed and not is_ws:
            body_resp = make_login(bad=False)
            resp = (
                "HTTP/1.1 200 OK\r\n"
                "Content-Type: text/html; charset=utf-8\r\n"
                f"Content-Length: {len(body_resp)}\r\n\r\n"
            ).encode() + body_re
